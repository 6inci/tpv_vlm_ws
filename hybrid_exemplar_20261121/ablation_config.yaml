# Ablation of step 4 (which candidate is the cube / an empty pallet). Written BEFORE the run (2026-11-22).
# Everything else is the hybrid pipeline unchanged: same DINO candidates and size gate, same slots (ASSUMED correct, as in the replay),
# same facility regions, occupancy rule (a pallet with a cube-like box centre inside is occupied), decide() with NMS 0.5,
# distinct IoU 0.1, margin 0.02, no-placement zone, accessibility, and the unchanged 11-20 scorer.
# All identifiers see the SAME crops (tight + context) of the same boxes (siglip_small_object_test, 2026-11-20).
# Offline: stored outputs only, no model call.
data:
  so400m: ../semantic_task_navigation/experiments/siglip_small_object_test/results/20261120_141616_followup_siglip_so400m/raw/embeddings_siglip_so400m
  base: ../semantic_task_navigation/experiments/siglip_small_object_test/results/20261120_134533_followup_siglip_base_qwen/raw/embeddings_siglip_base
  qwen_replies: ../semantic_task_navigation/experiments/siglip_small_object_test/results/20261120_134533_followup_siglip_base_qwen/raw/qwen_replies.jsonl
labels_from: multimodel_target_viewer config (24 labels, the photo records' 'labels'); template "This is a photo of {label}."
target_labels: {cube: [a red cube], empty_pallet: [a small pallet, a wooden pallet]}    # same groups as siglip_small_object_test

variants:
  qwen_name:            # Qwen3-VL-4B picks one of the 24 labels for each crop (stored replies, greedy)
    kind: name
    rule: "score = 1 if the label is a target label, else 0; cube_min_score 0.5 -> one named object = SELECTED, two or more distinct named = AMBIGUOUS"
  siglip_base_text:     # SigLIP2 base, image vs label text, top-1 of the 24 labels (combined views) = what 11-20 used for its type check
    kind: name
  siglip_so400m_text:
    kind: name
  siglip_base_exemplar: # image vs site exemplar crops, same rules as the hybrid (cube >= 0.88, margin 0.02)
    kind: exemplar
  siglip_so400m_exemplar: # = the hybrid pipeline (must reproduce replay_20261121_071147)
    kind: exemplar
name_cube_min_score: 0.5
note: "Qwen here judges each crop separately (same input as SigLIP). P3b instead let Qwen pick from a numbered region image; that variant needs the GPU and is not part of this ablation."
