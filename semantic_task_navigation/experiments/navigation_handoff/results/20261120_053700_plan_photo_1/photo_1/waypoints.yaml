frame_id: map
units:
  position: m
  yaw: deg (yaw_rad also given), ROS map frame, counter-clockwise from +x_map
note: 'Pose lists: start, rotations, direction-change points, goal. yaw = body heading
  (gripper side), NOT the movement direction. Giving these poses to Nav2 as goals
  lets Nav2 plan its OWN path between them; it does not make the robot follow path_A.csv
  / path_B.csv.'
status: grasp / placement UNVERIFIED (gripper offset unmeasured, provisional floor
  transform)
path_A: null
path_B: null
grasp_stop_pose: null
place_stop_pose: null
