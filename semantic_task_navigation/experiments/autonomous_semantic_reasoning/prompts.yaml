# Prompt text for the three conditions. The ONLY difference between conditions is the `prior` block:
#   A  : image + instruction                                  (no background knowledge)
#   B  : A + general 5S principles
#   C1 : A + general work-site space-management rules
# Everything else (head, tail/schema, image, model, decoding) is identical.
#
# Content rules (checked by test_probe_offline.py):
#   - no colour, coordinate, equipment position or zone of THIS site; no candidate regions;
#   - no query phrase chosen on a development image; no map / boundary / robot-reach information.
# The instruction text is inserted at {instruction}.
#
# Honesty note: the person who wrote these texts had seen the site. The wording of B and especially C1
# was written WITHOUT copying anything from the scene, but it was not written blind; C1 states the
# general convention that a loading/unloading area is a marked place where a vehicle stops. Treat C1 as
# a stronger hint than B, not as a neutral condition.

prompt_version: v3
