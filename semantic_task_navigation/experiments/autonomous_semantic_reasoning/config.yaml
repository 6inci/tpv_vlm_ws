    cube_xy_px: [541, 287]
    cube_note: "upper-left, outside the long yellow floor line; the image the user once started a v0.2 run on (run 20261117_222422_e316, cancelled)"
  - id: E1
    role: eval
    file: data/images/undistorted_25070552942982.png
