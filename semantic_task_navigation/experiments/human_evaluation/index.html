<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Human Evaluation</title>
<style>
:root { --bg:#f6f7f9; --panel:#ffffff; --ink:#1d2330; --muted:#5b6475; --line:#d9dde5; --accent:#2f5bd3; --ok:#1d8a4a; --bad:#c23b3b; --warn:#b7791f; --chip:#eef1f6; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 -apple-system, "Segoe UI", "Noto Sans KR", "Malgun Gothic", sans-serif; }
header { position:sticky; top:0; z-index:10; display:flex; gap:16px; align-items:center; flex-wrap:wrap; padding:10px 16px; background:#1d2330; color:#fff; }
header h1 { font-size:16px; margin:0 12px 0 0; }
header input { padding:4px 8px; border-radius:4px; border:0; }
header .status { font-size:12px; opacity:.9; }
nav.tabs { display:flex; gap:4px; padding:8px 16px 0; background:#1d2330; }
nav.tabs button { border:0; padding:8px 14px; border-radius:6px 6px 0 0; background:#39425a; color:#dfe4ee; cursor:pointer; font-size:14px; }
nav.tabs button.on { background:var(--bg); color:var(--ink); font-weight:600; }
.wrap { display:flex; gap:16px; padding:16px; align-items:flex-start; }
aside { width:230px; flex:none; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px; position:sticky; top:110px; }
aside .item { padding:6px 8px; border-radius:6px; cursor:pointer; display:flex; justify-content:space-between; gap:6px; align-items:center; }
aside .item:hover { background:var(--chip); }
aside .item.on { background:#dfe7fb; font-weight:600; }
main { flex:1; min-width:0; }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:14px; }
.panel h2 { font-size:15px; margin:0 0 10px; }
.panel h3 { font-size:14px; margin:12px 0 6px; }
.instr { font-size:18px; font-weight:600; padding:10px 12px; background:#fffbe6; border:1px solid #f0e2a8; border-radius:6px; }
.note { color:var(--muted); font-size:13px; }
.warnbox { background:#fff4e5; border:1px solid #f3c98b; padding:8px 10px; border-radius:6px; margin:8px 0; }
.infobox { background:#eef4ff; border:1px solid #c7d6fb; padding:8px 10px; border-radius:6px; margin:8px 0; }
.lockbox { background:#f3f3f3; border:1px dashed #aaa; padding:24px; text-align:center; border-radius:8px; }
.badge { font-size:11px; padding:1px 6px; border-radius:10px; background:var(--chip); color:var(--muted); white-space:nowrap; }
.badge.ok { background:#dcf3e5; color:var(--ok); } .badge.bad { background:#f8dede; color:var(--bad); } .badge.warn { background:#fbefd9; color:var(--warn); }
.imgbox { position:relative; overflow:auto; max-height:75vh; border:1px solid var(--line); border-radius:6px; background:#222; }
.imgbox img { display:block; width:100%; user-select:none; -webkit-user-drag:none; }
.imgbox canvas { position:absolute; left:0; top:0; }
.toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:8px 0; }
.toolbar label { display:inline-flex; gap:4px; align-items:center; }
button.btn { border:1px solid var(--line); background:#fff; padding:6px 12px; border-radius:6px; cursor:pointer; font-size:13px; }
button.btn:hover { background:var(--chip); }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
button.primary:hover { background:#244bb3; }
button.danger { color:var(--bad); }
table { border-collapse:collapse; width:100%; font-size:13px; }
th, td { border:1px solid var(--line); padding:4px 6px; text-align:left; vertical-align:top; }
th { background:#f1f3f7; font-weight:600; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.thumbs { display:flex; gap:10px; flex-wrap:wrap; }
.thumbs figure { margin:0; width:calc(50% - 5px); }
.thumbs img { width:100%; border:1px solid var(--line); border-radius:4px; cursor:zoom-in; }
.thumbs figcaption { font-size:12px; color:var(--muted); }
.form-row { margin:8px 0; }
.form-row > .lab { font-weight:600; display:block; margin-bottom:3px; }
select, textarea, input[type=text] { font:inherit; padding:4px 6px; border:1px solid var(--line); border-radius:4px; }
textarea { width:100%; min-height:44px; }
.rating { display:flex; gap:12px; flex-wrap:wrap; }
.evalitem { border-top:1px solid var(--line); padding:10px 0; }
.evalitem:first-child { border-top:0; }
.legend span { display:inline-flex; align-items:center; gap:4px; margin-right:12px; font-size:12px; }
.legend i { display:inline-block; width:18px; height:0; border-top:3px solid; }
.modal { position:fixed; inset:0; background:rgba(0,0,0,.8); display:none; z-index:100; overflow:auto; padding:20px; }
.modal img { max-width:none; width:auto; display:block; margin:0 auto; }
.modal .close { position:fixed; top:10px; right:20px; color:#fff; font-size:28px; cursor:pointer; }
.matrix td.cell { text-align:center; font-size:12px; }
.r-SUCCESS { background:#dcf3e5; } .r-FAILURE { background:#f8dede; } .r-UNCERTAIN { background:#fbefd9; } .r-NOT_EVALUATED { background:#ececec; }
.mono { font-family:ui-monospace, Menlo, Consolas, monospace; font-size:12px; }
@media (max-width: 900px) { .wrap { flex-direction:column; } aside { width:100%; position:static; } .grid2 { grid-template-columns:1fr; } .thumbs figure { width:100%; } }
</style>
</head>
<body>
<header>
  <h1>Human Evaluation · 작업 맥락 기반 목표 선택·경로</h1>
  <label>평가자 <input id="evaluator" type="text" placeholder="이름 또는 ID"></label>
  <span class="status" id="progress"></span>
  <span class="status" id="storage"></span>
</header>
<nav class="tabs">
  <button data-tab="A">A · 정답 기준 입력</button>
  <button data-tab="B">B · AI 결과 평가</button>
  <button data-tab="C">C · 종합 · 내보내기</button>
</nav>
<div class="wrap">
  <aside id="side"></aside>
  <main id="main"></main>
</div>
<div class="modal" id="modal"><span class="close" id="modalClose">✕</span><img id="modalImg" alt=""></div>

<script src="data.js"></script>
<script>
"use strict";
var D = window.HE_DATA;
var KEY = "he_task_context_2d_navigation_v1";
var STATE_SCHEMA = "human_evaluation_state_v1";
var RELATIONS_SRC = [["from", "출처 (~에서 생산된/온)"], ["on", "위에 (on)"], ["next_to", "옆 (next to)"], ["near", "근처 (near)"], ["inside", "안 (inside)"], ["none", "관계 없음"], ["other", "기타 (메모)"]];
var RELATIONS_DST = [["on", "위에 놓기 (on)"], ["next_to", "옆 (next to)"], ["near", "근처 (near)"], ["inside", "안 (inside)"], ["purpose_only", "목적만 제시 (예: 출하할 수 있는 곳)"], ["none", "관계 없음"], ["other", "기타 (메모)"]];
var AMBIGUITY = [["unique", "명확함 (허용 대상이 하나)"], ["multiple_acceptable", "허용 대상이 여러 개"], ["instruction_ambiguous", "명령 자체가 모호함"], ["not_executable", "이 장면에서 수행 불가"], ["undecided", "판단 보류"]];
var CERT = [["CONFIRMED", "확정"], ["UNCERTAIN", "불확실"]];

// ------------------------------------------------------------------ state (pure)
function emptyState() {
  return { schema: STATE_SCHEMA, evaluator: "", ground_truth: {}, evaluations: {}, revealed: {}, log: [] };
}
function emptyGT() {
  return { saved_at: null, first_saved_at: null, revised_after_reveal: false, history: [],
           source_boxes: [], source_hold: false, destination_boxes: [], destination_hold: false,
           source_relation: "", destination_relation: "", relation_note: "", ambiguity: "", rules: [], rules_other: "",
           certainty: { source: "", destination: "", relation: "", rules: "" }, comment: "" };
}
function gtValidate(g) {
  var errs = [];
  if (!g.source_boxes.length && !g.source_hold) errs.push("출발 물체를 사진에 표시하거나 '판단 보류'를 선택하세요.");
  if (!g.destination_boxes.length && !g.destination_hold) errs.push("허용 목적지를 표시하거나 '판단 보류'를 선택하세요.");
  if (!g.source_relation || !g.destination_relation) errs.push("출발·목적지 공간 관계를 선택하세요.");
  if (!g.ambiguity) errs.push("모호성 여부를 선택하세요.");
  ["source", "destination", "relation", "rules"].forEach(function (k) { if (!g.certainty[k]) errs.push("확실성(" + k + ")을 선택하세요."); });
  return errs;
}
function gtSaved(S, tid) { return !!(S.ground_truth[tid] && S.ground_truth[tid].saved_at); }
function evalOf(S, cid) {
  if (!S.evaluations[cid]) {
    var items = {}; D.items.forEach(function (it) { items[it.key] = { rating: null, comment: "" }; });
    S.evaluations[cid] = { items: items, overall_comment: "", updated_at: null };
  }
  return S.evaluations[cid];
}
function countRated(S, cid) {
  var e = S.evaluations[cid]; if (!e) return 0;
  return D.items.filter(function (it) { return e.items[it.key] && e.items[it.key].rating; }).length;
}
function overallStatus(S) {
  var gt = D.tasks.filter(function (t) { return gtSaved(S, t.task_id); }).length;
  var rated = 0; D.conditions.forEach(function (c) { rated += countRated(S, c.cond_id); });
  var total = D.conditions.length * D.items.length;
  return { gt_saved: gt, gt_total: D.tasks.length, items_rated: rated, items_total: total,
           status: (gt === D.tasks.length && rated === total) ? "COMPLETE" : "INCOMPLETE" };
}
function exportGT(S) {
  var st = overallStatus(S), tasks = {};
  D.tasks.forEach(function (t) {
    var g = S.ground_truth[t.task_id] || emptyGT();
    tasks[t.task_id] = { photo: t.photo, photo_label: D.photos[t.photo].label, instruction: t.instruction, saved_at: g.saved_at,
      revised_after_ai_reveal: g.revised_after_reveal, source_boxes_px: g.source_boxes, source_hold: g.source_hold,
      destination_boxes_px: g.destination_boxes, destination_hold: g.destination_hold, source_relation: g.source_relation,
      destination_relation: g.destination_relation, relation_note: g.relation_note, ambiguity: g.ambiguity, rules: g.rules,
      rules_other: g.rules_other, certainty: g.certainty, comment: g.comment, previous_versions: g.history };
  });
  return { schema: "human_ground_truth_v1", source: "HUMAN (entered in experiments/human_evaluation/index.html)", evaluator: S.evaluator || null,
           exported_at: new Date().toISOString(), status: st.gt_saved === st.gt_total ? "COMPLETE" : "INCOMPLETE",
           coordinate_frame: "undistorted image px (1920 x 1080)",
           note: "AI selections were hidden until each task's reference was saved; AI preliminary labels were not shown or used.", tasks: tasks };
}
function exportEval(S) {
  var st = overallStatus(S), conds = {};
  D.conditions.forEach(function (c) {
    var e = evalOf(S, c.cond_id), g = S.ground_truth[c.task_id] || {};
    conds[c.cond_id] = { task_id: c.task_id, condition: c.R, ratings: e.items, overall_comment: e.overall_comment, updated_at: e.updated_at,
      ground_truth_saved_before_ai_reveal: !!g.saved_at && !g.revised_after_reveal,
      ai_reference_not_human: { source_status: c.source.status, destination_status: c.destination.status, destination_kind: c.destination.kind,
                                route_category_by_code: c.routes.category_by_code, automatic_checks: c.automatic_checks } };
  });
  return { schema: "human_evaluation_v1", source: "HUMAN ratings; 'ai_reference_not_human' blocks are the stored AI/code outputs for context only",
           evaluator: S.evaluator || null, exported_at: new Date().toISOString(), status: st.status, progress: st, ai_run: D.meta.ai_run, conditions: conds };
}
function csvCell(v) { var s = v === null || v === undefined ? "" : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function exportCSV(S) {
  var rows = [["evaluator", "cond_id", "task_id", "condition", "item", "item_label", "rating", "comment", "updated_at", "gt_revised_after_ai_reveal", "ai_route_category_by_code(reference)"]];
  D.conditions.forEach(function (c) {
    var e = evalOf(S, c.cond_id), g = S.ground_truth[c.task_id] || {};
    D.items.forEach(function (it) {
      var r = e.items[it.key] || {};
      rows.push([S.evaluator, c.cond_id, c.task_id, c.R, it.key, it.label, r.rating || "", r.comment || "", e.updated_at || "", !!g.revised_after_reveal, c.routes.category_by_code]);
    });
  });
  return "﻿" + rows.map(function (r) { return r.map(csvCell).join(","); }).join("\n") + "\n";
}

// ------------------------------------------------------------------ persistence
var S = emptyState(), storageOK = true;
function load() {
  try { var raw = window.localStorage.getItem(KEY); if (raw) { var o = JSON.parse(raw); if (o && o.schema === STATE_SCHEMA) S = o; } }
  catch (e) { storageOK = false; }
}
function persist() {
  try { window.localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; } catch (e) { storageOK = false; }
  headerStatus();
}
function logEvent(what) { S.log.push({ t: new Date().toISOString(), what: what }); }

// ------------------------------------------------------------------ helpers
function el(tag, attrs, children) {
  var n = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function (k) {
    if (k === "text") n.textContent = attrs[k]; else if (k === "html") n.innerHTML = attrs[k];
    else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), attrs[k]); else n.setAttribute(k, attrs[k]);
  });
  (children || []).forEach(function (c) { if (c !== null && c !== undefined) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return n;
}
function txt(v) { return v === null || v === undefined || v === "" ? "—" : (Array.isArray(v) ? v.join(", ") : String(v)); }
function taskOf(tid) { return D.tasks.filter(function (t) { return t.task_id === tid; })[0]; }
function condOf(cid) { return D.conditions.filter(function (c) { return c.cond_id === cid; })[0]; }
function download(name, text, mime) {
  var blob = new Blob([text], { type: mime }), a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function openModal(src) { document.getElementById("modalImg").src = src; document.getElementById("modal").style.display = "block"; }
function statusBadge(s) {
  var cls = s === "SELECTED" ? "ok" : (s === "AMBIGUOUS" || s === "NOT_ACCESSIBLE") ? "warn" : "bad";
  return el("span", { class: "badge " + cls, text: s || "—" });
}

// ------------------------------------------------------------------ UI state
var UI = { tab: "A", task: D.tasks[0].task_id, cond: D.conditions[0].cond_id, mode: "source", zoom: 1 };

function headerStatus() {
  var st = overallStatus(S);
  document.getElementById("progress").textContent = "정답 기준 " + st.gt_saved + "/" + st.gt_total + " · 평가 항목 " + st.items_rated + "/" + st.items_total + " · " + st.status;
  document.getElementById("storage").textContent = storageOK ? "브라우저 자동 저장: 켜짐" : "⚠ 브라우저 저장 불가 - 화면 C에서 자주 내보내세요";
}
function render() {
  Array.prototype.forEach.call(document.querySelectorAll("nav.tabs button"), function (b) { b.classList.toggle("on", b.getAttribute("data-tab") === UI.tab); });
  renderSide();
  var main = document.getElementById("main"); main.innerHTML = "";
  if (UI.tab === "A") renderA(main); else if (UI.tab === "B") renderB(main); else renderC(main);
  headerStatus();
}
function renderSide() {
  var side = document.getElementById("side"); side.innerHTML = "";
  if (UI.tab === "A") {
    side.appendChild(el("div", { class: "note", text: "작업지시 (정답 기준은 R0/R1 공통)" }));
    D.tasks.forEach(function (t) {
      var g = S.ground_truth[t.task_id];
      var b = gtSaved(S, t.task_id) ? el("span", { class: "badge ok", text: g.revised_after_reveal ? "저장·공개 후 수정" : "저장됨" }) : el("span", { class: "badge", text: "미입력" });
      side.appendChild(el("div", { class: "item" + (UI.task === t.task_id ? " on" : ""), onclick: function () { UI.task = t.task_id; render(); } }, [t.task_id + " · " + D.photos[t.photo].label, b]));
    });
  } else if (UI.tab === "B") {
    side.appendChild(el("div", { class: "note", text: "조건 (작업지시 × R0/R1)" }));
    D.conditions.forEach(function (c) {
      var n = countRated(S, c.cond_id);
      var b = !gtSaved(S, c.task_id) ? el("span", { class: "badge", text: "잠김" }) : el("span", { class: "badge " + (n === D.items.length ? "ok" : n ? "warn" : ""), text: n + "/" + D.items.length });
      side.appendChild(el("div", { class: "item" + (UI.cond === c.cond_id ? " on" : ""), onclick: function () { UI.cond = c.cond_id; render(); } }, [c.cond_id, b]));
    });
  } else {
    side.appendChild(el("div", { class: "note", text: "종합 화면: 진행 상태와 내보내기" }));
  }
}

// ------------------------------------------------------------------ photo canvas
function photoCanvas(photoId, drawFn, interactive) {
  var p = D.photos[photoId];
  var box = el("div", { class: "imgbox" });
  var img = el("img", { src: p.file, alt: p.label, draggable: "false" });
  var cv = el("canvas");
  box.appendChild(img); box.appendChild(cv);
  img.style.width = (100 * UI.zoom) + "%";
  function scale() { return img.clientWidth / p.w; }
  function redraw(temp) {
    cv.width = img.clientWidth; cv.height = img.clientHeight;
    var ctx = cv.getContext("2d"), s = scale();
    ctx.clearRect(0, 0, cv.width, cv.height);
    drawFn(ctx, s);
    if (temp) { ctx.setLineDash([4, 3]); ctx.strokeStyle = "#ffeb3b"; ctx.lineWidth = 2; ctx.strokeRect(temp[0] * s, temp[1] * s, (temp[2] - temp[0]) * s, (temp[3] - temp[1]) * s); ctx.setLineDash([]); }
  }
  img.addEventListener("load", function () { redraw(); });
  UI.currentRedraw = redraw;
  if (interactive) {
    var start = null;
    cv.style.cursor = "crosshair";
    cv.addEventListener("pointerdown", function (e) { var s = scale(); start = [e.offsetX / s, e.offsetY / s]; cv.setPointerCapture(e.pointerId); });
    cv.addEventListener("pointermove", function (e) { if (!start) return; var s = scale(); redraw([Math.min(start[0], e.offsetX / s), Math.min(start[1], e.offsetY / s), Math.max(start[0], e.offsetX / s), Math.max(start[1], e.offsetY / s)]); });
    cv.addEventListener("pointerup", function (e) {
      if (!start) return; var s = scale();
      var b = [Math.min(start[0], e.offsetX / s), Math.min(start[1], e.offsetY / s), Math.max(start[0], e.offsetX / s), Math.max(start[1], e.offsetY / s)].map(function (v) { return Math.round(v * 10) / 10; });
      start = null;
      if (b[2] - b[0] >= 3 && b[3] - b[1] >= 3) interactive(b); else redraw();
    });
  }
  box.redraw = redraw;
  return box;
}
function strokeBox(ctx, s, b, color, label, dashed, width) {
  if (!b) return;
  ctx.setLineDash(dashed ? [8, 5] : []); ctx.strokeStyle = color; ctx.lineWidth = width || 2;
  ctx.strokeRect(b[0] * s, b[1] * s, (b[2] - b[0]) * s, (b[3] - b[1]) * s);
  ctx.setLineDash([]);
  if (label) { ctx.font = "12px sans-serif"; var w = ctx.measureText(label).width + 6; ctx.fillStyle = "rgba(0,0,0,.7)"; ctx.fillRect(b[0] * s, b[1] * s - 15, w, 15); ctx.fillStyle = color; ctx.fillText(label, b[0] * s + 3, b[1] * s - 3); }
}
function zoomBar(onChange) {
  var bar = el("span", {}, ["확대: "]);
  [[1, "맞춤"], [1.5, "150%"], [2, "200%"], [3, "300%"]].forEach(function (z) {
    bar.appendChild(el("button", { class: "btn" + (UI.zoom === z[0] ? " primary" : ""), text: z[1], onclick: function () { UI.zoom = z[0]; onChange(); } }));
  });
  return bar;
}

// ------------------------------------------------------------------ screen A
function renderA(main) {
  var t = taskOf(UI.task), p = D.photos[t.photo];
  if (!S.ground_truth[t.task_id]) S.ground_truth[t.task_id] = emptyGT();
  var g = S.ground_truth[t.task_id];
  var revealed = !!S.revealed[t.task_id];
  var head = el("div", { class: "panel" }, [
    el("h2", { text: "화면 A · 정답 기준 입력 — " + t.task_id + " (" + p.label + ")" }),
    el("div", { class: "instr", text: t.instruction }),
    el("p", { class: "note", text: "이 화면에는 원본 사진과 작업지시만 표시됩니다. AI의 선택은 이 작업의 기준을 저장한 뒤 화면 B에서 공개됩니다. AI 예비 라벨은 표시하지 않습니다." }),
    t.reference_note ? el("div", { class: "infobox", text: t.reference_note }) : null,
    revealed ? el("div", { class: "warnbox", text: "이 작업의 AI 결과를 이미 열람했습니다. 지금 기준을 수정해 저장하면 'AI 공개 후 수정'으로 기록되며 이전 값도 보존됩니다." }) : null
  ]);
  main.appendChild(head);
