<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Review v2</title>
<style>
:root { --bg:#f5f6f8; --card:#fff; --ink:#1f2430; --muted:#5f6878; --line:#dde1e8; --accent:#2f5bd3; --ok:#1d8a4a; --bad:#c23b3b; --warn:#a86b12; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 -apple-system, "Segoe UI", "Noto Sans KR", "Malgun Gothic", sans-serif; }
header { background:#1f2430; color:#fff; padding:10px 20px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
header b { font-size:16px; }
header .sp { flex:1; }
header input { padding:3px 8px; border-radius:4px; border:0; width:140px; }
.page { max-width:1500px; margin:0 auto; padding:18px 20px 60px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:16px; }
h1 { font-size:20px; margin:0 0 8px; } h2 { font-size:17px; margin:0 0 10px; } h3 { font-size:15px; margin:12px 0 6px; }
.instr { font-size:19px; font-weight:600; background:#fffbe6; border:1px solid #efe0a3; border-radius:8px; padding:10px 14px; margin:6px 0 10px; }
.muted { color:var(--muted); font-size:13px; }
.q { border:2px solid #c9d6f7; background:#f5f8ff; border-radius:10px; padding:12px 14px; margin-top:10px; }
.q .title { font-weight:700; margin-bottom:6px; }
.opts { display:flex; flex-wrap:wrap; gap:8px; }
.opts label { border:1px solid var(--line); background:#fff; border-radius:20px; padding:4px 12px; cursor:pointer; user-select:none; }
.opts input { display:none; }
.opts label.on { background:var(--accent); border-color:var(--accent); color:#fff; }
.opts label.skip { color:var(--muted); }
input.note { width:100%; margin-top:8px; padding:5px 8px; border:1px solid var(--line); border-radius:6px; font:inherit; font-size:14px; }
.cols { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.photo { position:relative; border-radius:8px; overflow:hidden; background:#222; cursor:zoom-in; }
.photo img { display:block; width:100%; }
.photo canvas { position:absolute; left:0; top:0; }
.legend { font-size:12px; color:var(--muted); margin:6px 0; display:flex; flex-wrap:wrap; gap:10px; }
.legend i { display:inline-block; width:16px; border-top:3px solid; vertical-align:middle; margin-right:3px; }
.concepts { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin:8px 0; }
.concepts div { background:#f7f8fa; border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:13px; }
.concepts b { display:block; font-size:12px; color:var(--muted); font-weight:600; }
.ai { font-size:14px; }
.ai .row { display:flex; gap:8px; padding:6px 0; border-top:1px solid #eef0f4; }
.ai .row:first-child { border-top:0; }
.ai .k { width:110px; flex:none; color:var(--muted); font-size:13px; }
.tag { display:inline-block; font-size:12px; padding:0 8px; border-radius:10px; margin-right:4px; }
.t-sel { background:#dcf3e5; color:var(--ok); } .t-hold { background:#fbefd9; color:var(--warn); } .t-none { background:#f3dede; color:var(--bad); }
.flag { background:#fff2e2; border:1px solid #f0c98d; border-radius:6px; padding:4px 8px; font-size:13px; margin-top:4px; }
.path img { width:100%; border:1px solid var(--line); border-radius:6px; cursor:zoom-in; }
details { margin-top:8px; font-size:13px; } details summary { cursor:pointer; color:var(--accent); }
table { border-collapse:collapse; width:100%; font-size:13px; }
th, td { border:1px solid var(--line); padding:4px 6px; text-align:left; vertical-align:top; }
th { background:#f2f4f7; }
.nav { display:flex; gap:10px; justify-content:space-between; align-items:center; }
button { font:inherit; border:1px solid var(--line); background:#fff; border-radius:8px; padding:7px 16px; cursor:pointer; }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
button:disabled { opacity:.5; cursor:default; }
.steps { display:flex; gap:6px; flex-wrap:wrap; }
.steps span { font-size:12px; padding:2px 10px; border-radius:12px; background:#39425a; color:#dfe4ee; cursor:pointer; }
.steps span.on { background:#fff; color:#1f2430; font-weight:700; }
.steps span.done::after { content:" ✓"; }
.hidden { display:none; }
.agree { color:var(--ok); } .disagree { color:var(--bad); font-weight:600; } .na { color:var(--muted); }
.modal { position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:50; overflow:auto; display:none; padding:20px; }
.modal canvas, .modal img { display:block; margin:0 auto; max-width:none; }
.modal .x { position:fixed; right:22px; top:10px; color:#fff; font-size:28px; cursor:pointer; }
.marks { font-size:13px; margin-top:6px; }
@media (max-width:1000px) { .cols { grid-template-columns:1fr; } .concepts { grid-template-columns:1fr 1fr; } }
</style>
</head>
<body>
<header>
  <b>작업지시 결과 검토 v2</b>
  <div class="steps" id="steps"></div>
  <span class="sp"></span>
  <label>평가자 <input id="who" type="text" placeholder="이름"></label>
  <span class="muted" style="color:#c9cfdb" id="saveinfo"></span>
</header>
<div class="page" id="page"></div>
<div class="modal" id="modal"><span class="x">✕</span><div id="modalBody"></div></div>

<script src="data.js"></script>
<script>
"use strict";
var D = window.HE_DATA;
var KEY = "he_review_v2";                         // v2 storage (separate)
var V1_KEY = "he_task_context_2d_navigation_v1";   // v1 storage: READ ONLY, never written or removed here
var SCHEMA = "human_review_v2";

var Q1 = [["valid", "수행 가능"], ["ambiguous", "의미가 모호함"], ["infeasible", "수행 불가능"], ["cannot_judge", "판단 불가"]];
var Q2 = [["correct", "올바름"], ["wrong", "잘못됨"], ["proper_hold", "적절하게 판단 보류"], ["cannot_judge", "판단 불가"]];
var Q3 = [["appropriate", "적절함"], ["inappropriate", "부적절함"], ["proper_hold", "적절하게 판단 보류"], ["cannot_judge", "판단 불가"]];
var Q4 = [["valid", "타당함"], ["invalid", "부적절함"], ["needs_check", "추가 검증 필요"]];
// v1 'ambiguity' -> Q1 (shown to the user as a pre-filled, editable suggestion with its origin)
var V1_TO_Q1 = { unique: "valid", multiple_acceptable: "valid", instruction_ambiguous: "ambiguous", not_executable: "infeasible", undecided: "cannot_judge" };

// ------------------------------------------------------------------ pure logic (tested with node)
function emptyState() { return { schema: SCHEMA, evaluator: "", tasks: {}, conditions: {}, imported_v1: null, marks: {} }; }
function ans(v, src) { return { value: v, source: src || "user_v2", at: new Date().toISOString() }; }
function importV1(S, v1) {
  if (!v1 || v1.schema !== "human_evaluation_state_v1") return 0;
  S.imported_v1 = { read_at: new Date().toISOString(), evaluator: v1.evaluator || "", ground_truth: JSON.parse(JSON.stringify(v1.ground_truth || {})) };
  var n = 0;
  Object.keys(S.imported_v1.ground_truth).forEach(function (tid) {
    var g = S.imported_v1.ground_truth[tid];
    if (!g || !g.saved_at) return;
    n++;
    var t = S.tasks[tid] || (S.tasks[tid] = {});
    if (!t.q1 && V1_TO_Q1[g.ambiguity]) t.q1 = ans(V1_TO_Q1[g.ambiguity], "imported_v1 (ambiguity=" + g.ambiguity + ")");
    if (!t.q1_note && g.comment) t.q1_note = g.comment;
  });
  if (!S.evaluator && v1.evaluator) S.evaluator = v1.evaluator;
  return n;
}
function aiSourceClaim(c) { return c.source.status === "SELECTED" ? "chose" : (c.source.status === "AMBIGUOUS" || c.source.status === "NOT_FOUND") ? "held" : "none"; }
function aiDestClaim(c) { return c.destination.status === "SELECTED" ? "chose" : (c.destination.status === "AMBIGUOUS" || c.destination.status === "NOT_ACCESSIBLE" || c.destination.status === "NOT_FOUND") ? "held" : "none"; }
function hasPath(c) { return c.routes.plans.some(function (p) { return p.path_A_cm !== null && p.path_A_cm !== undefined; }); }
function agreement(claim, v, okVals) {
  // AI chose / held  vs  the human answer -> agree | disagree | n/a
  if (!v || v === "cannot_judge") return "n/a";
  if (claim === "chose") return okVals.indexOf(v) >= 0 ? "agree" : (v === "proper_hold" ? "disagree" : "disagree");
  if (claim === "held") return v === "proper_hold" ? "agree" : "disagree";
  return "n/a";
}
function summaryRows(S) {
  return D.conditions.map(function (c) {
    var a = S.conditions[c.cond_id] || {}, t = S.tasks[c.task_id] || {};
    var q2 = a.q2 && a.q2.value, q3 = a.q3 && a.q3.value, q4 = a.q4 && a.q4.value;
    return { cond_id: c.cond_id, task_id: c.task_id, R: c.R, q1: t.q1 ? t.q1.value : "", ai_source: c.source.status + (c.source.selected.length ? " " + c.source.selected.map(function (x) { return x.id; }).join("/") : ""),
             ai_destination: c.destination.status + (c.destination.id ? " " + c.destination.id : ""), ai_route_category_by_code: c.routes.category_by_code,
             q2: q2 || "", q3: q3 || "", q4: q4 || "", path_exists: hasPath(c),
             source_agreement: agreement(aiSourceClaim(c), q2, ["correct"]), destination_agreement: agreement(aiDestClaim(c), q3, ["appropriate"]),
             code_autonomous_but_user_inappropriate: c.routes.category_by_code.indexOf("AUTONOMOUS") === 0 && q3 === "inappropriate" };
  });
}
function progress(S) {
  var q1 = D.tasks.filter(function (t) { return S.tasks[t.task_id] && S.tasks[t.task_id].q1; }).length, need = 0, got = 0;
  D.conditions.forEach(function (c) { var a = S.conditions[c.cond_id] || {}; need += 2 + (hasPath(c) ? 1 : 0); got += (a.q2 ? 1 : 0) + (a.q3 ? 1 : 0) + (hasPath(c) && a.q4 ? 1 : 0); });
  return { q1: q1, q1_total: D.tasks.length, answers: got, answers_total: need, status: (q1 === D.tasks.length && got === need) ? "COMPLETE" : "INCOMPLETE" };
}
function exportJSON(S) {
  return { schema: SCHEMA, source: "HUMAN review (experiments/human_evaluation/review_v2.html)", evaluator: S.evaluator || null, exported_at: new Date().toISOString(),
           progress: progress(S), questions: { Q1: Q1, Q2: Q2, Q3: Q3, Q4: Q4 }, ai_run: D.meta.ai_run,
           tasks: D.tasks.map(function (t) { var s = S.tasks[t.task_id] || {}; return { task_id: t.task_id, instruction: t.instruction, q1: s.q1 || null, q1_note: s.q1_note || "", optional_marks_px: S.marks[t.task_id] || [] }; }),
           conditions: summaryRows(S).map(function (r) { var a = S.conditions[r.cond_id] || {}; return { cond_id: r.cond_id, human: { q2: a.q2 || null, q3: a.q3 || null, q4: a.q4 || null, note: a.note || "" },
             ai_reference_not_human: { source: r.ai_source, destination: r.ai_destination, route_category_by_code: r.ai_route_category_by_code }, comparison: { source: r.source_agreement, destination: r.destination_agreement, code_autonomous_but_user_inappropriate: r.code_autonomous_but_user_inappropriate } }; }),
           imported_v1_read_only: S.imported_v1 };
}
function csvCell(v) { var s = v === null || v === undefined ? "" : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function exportCSV(S) {
  var head = ["evaluator", "cond_id", "task_id", "condition", "q1_instruction_valid", "q2_source", "q3_destination", "q4_path", "path_exists", "note", "ai_source(ref)", "ai_destination(ref)", "ai_route_category(ref)", "source_agreement", "destination_agreement"];
  var rows = summaryRows(S).map(function (r) { var a = S.conditions[r.cond_id] || {};
    return [S.evaluator, r.cond_id, r.task_id, r.R, r.q1, r.q2, r.q3, r.q4, r.path_exists, a.note || "", r.ai_source, r.ai_destination, r.ai_route_category_by_code, r.source_agreement, r.destination_agreement]; });
  return "﻿" + [head].concat(rows).map(function (r) { return r.map(csvCell).join(","); }).join("\n") + "\n";
}

// ------------------------------------------------------------------ AI explanation in plain Korean (from the stored run)
var REL_KO = { on: "‘위/안(on)’ → 기준 물체 박스 안에서만 찾음", next_to: "‘옆(next to)’ → 기준 물체 주변 영역에서 찾음", near: "‘근처(near)’ → 기준 물체 주변 영역에서 찾음",
               from: "‘출처(from)’ → 기준 물체 주변 영역에서 찾음", none: "관계 없음 → 기준 물체 주변 영역에서 찾음" };
function sourceText(c) {
  var s = c.source, rated = s.ratings.filter(function (r) { return r.role === "object_to_move"; });
  if (s.status === "SELECTED") {
    var r = rated[0] || {};
    return { tag: "t-sel", head: "선택: " + s.selected.map(function (x) { return x.id; }).join(", "), body: "AI가 본 모습: " + ((r.appearance || []).join(", ") || "—") };
  }
  if (s.status === "AMBIGUOUS") return { tag: "t-hold", head: "판단 보류 (후보 " + s.selected.length + "개 동률)", body: "AI가 모두 '옮길 물체'로 본 후보: " + rated.map(function (r) { return r.id + " (" + (r.appearance || []).join(", ") + ")"; }).join(" · ") };
  return { tag: "t-none", head: s.status, body: s.why || "" };
}
function destText(c) {
  var d = c.destination, acc = d.accessibility || {}, ok = [], far = [];
  Object.keys(acc).forEach(function (k) {
    var a = acc[k], lab = a.id + " ‘" + (a.appearance || []).join(", ") + "’ (" + (a.role === "suitable" ? "적합" : "가능") + ")";
    (a.accessible ? ok : far).push(lab + (a.accessible ? "" : " — 로봇이 다가갈 수 없음: 주행 구역에서 " + a.gap_to_drivable_cm + " cm"));
  });
  var lines = [];
  if (far.length) lines.push("의미상 후보지만 접근 불가: " + far.join(" · "));
  if (ok.length) lines.push("접근 가능한 후보: " + ok.join(" · "));
  var p15 = d.ratings.filter(function (r) { return (r.appearance || []).join(" ").toLowerCase().match(/manhole|grate/); });
  if (p15.length) lines.push("AI가 ‘" + p15.map(function (r) { return (r.appearance || []).join(", "); }).join(" / ") + "’로 보고 부적합 판정한 후보: " + p15.map(function (r) { return r.id; }).join(", "));
  if (d.status === "SELECTED") return { tag: "t-sel", head: "선택: " + d.id + (d.kind === "DIRECT" ? " (AI 1순위)" : " (대안: 1순위에 접근 불가)"), body: lines };
  var why = { AMBIGUOUS: "판단 보류 — 접근 가능한 후보가 여러 개로 동률", NOT_ACCESSIBLE: "선택 안 함 — 적합한 후보에 로봇이 접근할 수 없고 대안도 없음", NOT_FOUND: "선택 안 함 — 적합한 후보 없음", NO_REFERENCE: "선택 안 함 — 목적지 기준 시설을 찾지 못함" }[d.status] || d.status;
  return { tag: d.status === "AMBIGUOUS" || d.status === "NOT_ACCESSIBLE" ? "t-hold" : "t-none", head: why, body: lines };
}
function zoneText(c) {
  var z = c.interpretation.zones_seen, f = z.filter(function (x) { return x.access === "forbidden"; }).map(function (x) { return x.description; });
  var ped = z.some(function (x) { return /pedestrian|walkway|보행/i.test(x.description || ""); });
  return (c.R === "R0" ? "규칙 미제공. " : "작업장 규칙 제공. ") + "AI가 진입 금지로 본 구역: " + (f.length ? f.join(", ") : "없음") + (ped ? "" : " · 보행자 통로를 언급하지 않음");
}
function routeText(c) {
  var p = c.routes.plans;
  if (!hasPath(c)) return "경로 없음 (출발 대상이 정해지지 않음)";
  var main = p[0], diag = main.label.indexOf("DIAGNOSTIC") === 0;
  var s = (diag ? "진단용 경로(출발 후보 동률, 자율 선택 결과 아님): " : "") + "경로 A " + main.path_A_cm + " cm (로봇 출발 → 출발 물체 앞 정차)";
  s += main.path_B_cm ? ", 경로 B " + main.path_B_cm + " cm (→ 배치 장소 앞 정차, 남는 간격 " + main.path_B_gap_cm + " cm)" : ", 경로 B 없음 (" + (main.path_B_why || "") + ")";
  return s;
}

// ------------------------------------------------------------------ persistence (v2 key only)
var S = emptyState(), canStore = true;
function load() { try { var r = localStorage.getItem(KEY); if (r) { var o = JSON.parse(r); if (o && o.schema === SCHEMA) S = o; } } catch (e) { canStore = false; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); canStore = true; } catch (e) { canStore = false; } info(); }
function readV1() { try { var r = localStorage.getItem(V1_KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
function info() { var p = progress(S); var el = document.getElementById("saveinfo"); if (el) el.textContent = "답변 " + (p.q1 + p.answers) + "/" + (p.q1_total + p.answers_total) + " · " + (canStore ? "자동 저장됨" : "⚠ 브라우저 저장 불가 — 요약에서 내보내기"); }

// ------------------------------------------------------------------ DOM helpers
function h(tag, a, kids) {
  var n = document.createElement(tag);
  Object.keys(a || {}).forEach(function (k) { if (k === "text") n.textContent = a[k]; else if (k.indexOf("on") === 0) n.addEventListener(k.slice(2), a[k]); else n.setAttribute(k, a[k]); });
  (kids || []).forEach(function (c) { if (c != null) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return n;
}
function optionGroup(name, opts, current, onPick, allowSkip) {
  var g = h("div", { class: "opts" });
  opts.forEach(function (o) {
    var lab = h("label", { class: current === o[0] ? "on" : "", "data-v": o[0] }, [h("input", { type: "radio", name: name }), o[1]]);
    lab.addEventListener("click", function (e) { e.preventDefault(); mark(o[0]); onPick(o[0]); });
    g.appendChild(lab);
  });
  if (allowSkip) { var sk = h("label", { class: "skip" }, ["건너뛰기"]); sk.addEventListener("click", function (e) { e.preventDefault(); mark(null); onPick(null); }); g.appendChild(sk); }
  function mark(v) { Array.prototype.forEach.call(g.querySelectorAll("label[data-v]"), function (l) { l.classList.toggle("on", l.getAttribute("data-v") === v); }); }
  return g;
}
function box(ctx, s, b, color, label, dashed, w) {
  if (!b) return;
  ctx.setLineDash(dashed ? [8, 5] : []); ctx.strokeStyle = color; ctx.lineWidth = w || 2;
  ctx.strokeRect(b[0] * s, b[1] * s, (b[2] - b[0]) * s, (b[3] - b[1]) * s); ctx.setLineDash([]);
  if (label) { ctx.font = Math.max(11, Math.round(13 * Math.min(1.4, s * 1.6))) + "px sans-serif"; var tw = ctx.measureText(label).width + 6; ctx.fillStyle = "rgba(0,0,0,.72)"; ctx.fillRect(b[0] * s, Math.max(0, b[1] * s - 16), tw, 16); ctx.fillStyle = color; ctx.fillText(label, b[0] * s + 3, Math.max(12, b[1] * s - 4)); }
}
function drawAI(c) {
  return function (ctx, s) {
    var r = c.references;
    box(ctx, s, r.source.region, "#ffb020", "출발 탐색 영역", true, 2);
    box(ctx, s, r.destination.region, "#4dd0e1", "목적지 탐색 영역", true, 2);
    box(ctx, s, r.source.box, "#ffb020", "출발 기준: " + (r.source.name || ""), false, 1);
    box(ctx, s, r.destination.box, "#4dd0e1", "목적지 기준: " + (r.destination.name || ""), false, 1);
    c.source.selected.forEach(function (x) { if (x.box) box(ctx, s, [x.box[0] - 4, x.box[1] - 4, x.box[2] + 4, x.box[3] + 4], "#ff4d4d", (c.source.status === "SELECTED" ? "옮길 물체 " : "동률 ") + x.id, false, 3); });
    if (c.destination.box) box(ctx, s, c.destination.box, "#33d17a", "배치 목표 " + c.destination.id, false, 3);
  };
}
function drawMarks(tid) {
  return function (ctx, s) {
    (S.marks[tid] || []).forEach(function (m) { ctx.fillStyle = m.kind === "object" ? "#ff4d4d" : "#33d17a"; ctx.beginPath(); ctx.arc(m.x * s, m.y * s, 7, 0, 7); ctx.fill(); ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke(); });
    var v1 = S.imported_v1 && S.imported_v1.ground_truth[tid];
