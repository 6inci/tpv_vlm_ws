# Task-plan prototype on the E1 photo: stored Qwen result + stored E1 cube candidate + stored robot start
#   -> provisional floor transform (mat seams) -> BEV map -> rectangular-footprint A* legs A (pick-up approach) and B (carry) -> virtual steps.
# Everything below is declared BEFORE the run it governs. Nothing here changes v0.2 (config/*.yaml, src/), V1/V2, a frozen Qwen prompt,
# stored results or the calibration file. No model call, no GPU, no hardware command.
experiment_id: task_plan_prototype
instruction: "빨간 큐브를 출하할 수 있는 적절한 장소로 옮겨줘."
image: /home/binci/Pictures/Calibration/undistorted_25070552942982.png          # E1, 1920x1080, undistorted with the read-only calibration
image_sha256: 6535b84a74007508b6ffa2720508f120ea4712b7ab2df3fd09fdd05f03b52605
results_dir: results

# STORED results that are reused (read only)
stored:
  e1_run: ../semantic_to_navigation_integration/results/20261118_203058_46d8       # task_parse, target_inspection (DINO+HSV candidates + Qwen crop gate)
  first_path_run: ../first_vlm_navigation_path/results/20261119_001504_first_path   # verified robot box, transferred DRAFT map (MANUAL_MAP_PRIOR)
  funnel_run: ../cube_candidate_funnel/results/20261119_051618_funnel              # where the cube candidate drops out (AI preliminary labels)

# PROVISIONAL_TARGET: chosen WITHOUT any label, by a rule fixed here. The stored Qwen crop gate answered "no" for it; that record is kept as is.
target_candidate:
  rule: "rank 1 of the stored v0.2 merged candidate list, provided >= 2 distinct source types (hsv_color_shape + a Grounding DINO source)"
  min_distinct_sources: 2
  expected_candidate_id: target_cand1        # pin: what the rule gave in the cube_candidate_funnel record
  status: PROVISIONAL_TARGET                 # never CONFIRMED; not used as evidence of detection accuracy or pick-up success

# ---- Floor-plane transform. NOT the 2026-09-06 homography: that one belongs to another floor layout, another undistorted frame (2016x1133,
# other new_camera_matrix, photo_04) and is not used. config/camera.yaml still says homography_status: not_available.
# Provisional transform from the mat seams of THIS photo and the user-given mat size (105 x 105 cm, 3 x 2, gaps ignored).
floor:
  mat_cm: 105
  mats_cols: 3
  mats_rows: 2
  status_if_accepted: PROVISIONAL_UNVALIDATED     # seeds are AI-picked; refined on image evidence; not human confirmed
  ridge: {sigma: 1.6, percentile: 99.5, threshold: 0.25, search_px: 10, half_len_px: 130, sample_step_px: 4, min_samples: 20, iterations: 4}
  # grid node (col,row) -> approximate pixel (read off the ridge map by the AI; only a starting point). v_side/h_side: +1 samples the vertical
  # (horizontal) seam below (right of) the node only, -1 above (left of), 0 both sides (nodes at the mat edge: only the inner side is straight).
  grid_seeds:
    "2,0": {xy: [1202, 60],    v_dir: [0.09, 1],   h_dir: [1, 0.0],    v_side: 1,  h_side: 0}
    "1,1": {xy: [685, 469],    v_dir: [-0.115, 1], h_dir: [1, -0.02],  v_side: 0,  h_side: 0}
    "2,1": {xy: [1236, 463],   v_dir: [0.10, 1],   h_dir: [1, -0.02],  v_side: 0,  h_side: 0}
    "3,1": {xy: [1767, 451],   v_dir: [0.25, 1],   h_dir: [1, -0.02],  v_side: 0,  h_side: -1}
    "0,2": {xy: [72, 983],     v_dir: [-0.25, 1],  h_dir: [1, 0.084],  v_side: -1, h_side: 1}
    "1,2": {xy: [625, 1030],   v_dir: [-0.115, 1], h_dir: [1, 0.0],    v_side: -1, h_side: 0}
    "2,2": {xy: [1273, 1030],  v_dir: [0.07, 1],   h_dir: [1, 0.0],    v_side: -1, h_side: 0}
    "3,2": {xy: [1877, 982],   v_dir: [0.25, 1],   h_dir: [1, -0.08],  v_side: -1, h_side: -1}
  # Independent check: inner seams are NOT used in the fit except at their nodes. Dense ridge samples along them, mapped to the floor,
  # must lie on the known world line (x = 105 or 210 cm, y = 105 cm). All three are inside the planned work band (Z02).
  seam_checks:
    - {id: V1, axis: x, world_cm: 105, p0: [700, 320],  p1: [655, 825],   inlier_px: 3.0}
    - {id: V2, axis: x, world_cm: 210, p0: [1222, 320], p1: [1263, 825],  inlier_px: 3.0}
    - {id: H1, axis: y, world_cm: 105, p0: [560, 470],  p1: [1700, 455],  inlier_px: 3.0}
  accept: {min_nodes: 8, max_fit_rms_cm: 4.0, max_seam_dev_cm: 4.0}   # otherwise: no BEV map and no plan
  margin_rule: ceil to 0.5 cm of the largest |deviation| of the independent seam samples   # footprint margin per side (uncertainty of the transform)

# ---- Robot (user-given initial geometry). Wheel inclusion in the 35 x 24 cm is TO BE CONFIRMED. Gripper reach, grasp pose: UNVERIFIED, not assumed.
robot:
  length_cm: 35
  width_cm: 24
  height_cm: 16
  source: user-provided initial geometry (wheel inclusion not confirmed)
  motion: "mecanum omnidirectional: translation with the heading held fixed along each leg (forward / lateral / diagonal). Dynamics NOT validated."
  headings_deg: [0, 90]          # long axis along floor +x (0) or +y (90); each leg is planned for each heading
  rotation_in_place_check: circumscribed disc of the footprint (conservative) at the poses where the heading changes
  start_shift_toward_principal_point_px: [0, 20, 40]   # the stored first-path start variants (outline centre -> floor point), primary = 0

# ---- BEV planning grid (provisional floor frame floor_cm: x along the mat columns, y along the mat rows, origin = grid node (0,0), y grows towards the camera)
bev:
  px_per_cm: 2
  pad_cm: 10
  cell_px: 4                     # 2 cm cells
  safety_margin_px: 20           # soft clearance cost (SAFETY_COST_ASTAR), not a collision condition
  validation_tolerance_px: 2     # v0.2 validator tolerance: 1 cm here (v0.2 default is 8 px of IMAGE px)
  check_px_per_cm: 4             # independent footprint sweep: re-rasterised from the cm polygons
  check_step_cm: 0.5

# ---- Approach points. The reach of the gripper is NOT assumed: the approach point is the reachable position NEAREST to the target
# (+ a path-cost tie-break inside this slack band, not a reach claim). The distance the gripper would have to bridge is reported instead.
approach:
  slack_cm: 6
  distance_weight: 1.5           # v0.2 goal_selection.*.distance_weight

footprint_variants:              # label -> margin per side; the primary one is the first
  - {label: conservative_margin, margin: from_floor_transform, role: PRIMARY}
  - {label: nominal_no_margin, margin_cm: 0, role: "SENSITIVITY (not conservative: ignores the measured transform error)"}
  - {label: outline_box_stress, margin_cm: 0, size: robot_outline_on_floor, role: "STRESS (verified outline box of the robot mapped to the floor; includes height parallax, so an upper bound)"}

claims:
  robot_task_success: NOT_CLAIMABLE
  grasp_or_placement_success: NOT_CLAIMABLE
  detection_accuracy: NOT_COMPUTED
  metric_validity: "PROVISIONAL floor transform with measured residuals; not validated for the installation"
