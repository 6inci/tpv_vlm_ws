# Model inference runs in a separate worker process inside the existing qwen_vl env
# (unchanged). Weights are loaded from the existing HF cache with local_files_only=True.
worker:
  python: /home/binci/miniconda3/envs/qwen_vl/bin/python
  startup_timeout_s: 120
  request_timeout_s: 600     # includes first-time model loading
  # exclusive: only one model on the GPU at a time (swap on demand). Measured 2026-11-15:
  # Qwen3-VL-4B bf16 (8.3 GiB) + Grounding DINO inference -> CUDA OOM on the 12 GB GPU.
  gpu_residency: exclusive

qwen:
  model_id: Qwen/Qwen3-VL-4B-Instruct
  revision: null             # null -> refs/main of the local cache
  dtype: bfloat16
  do_sample: false
  max_new_tokens:
    task_parse: 384
    scene_analysis: 768
    verify: 160
    region_select: 320
    grounding: 512

grounding_dino:
  model_id: IDEA-Research/grounding-dino-tiny
  revision: null
  # Low thresholds: the detector only proposes candidates; Qwen3-VL verifies each crop.
  # DEV NOTE (2026-11-15, reference image = development data): at 0.20 the real conveyor was
  # not proposed; at 0.10 it appears at rank 5-12 depending on the prompt.
  box_threshold: 0.10
  text_threshold: 0.10
  nms_iou: 0.5
  max_area_frac: 0.25          # drop boxes covering most of the image (whole-workspace boxes)
  # Detector prompts per canonical class (one detector call per prompt, merged by NMS).
  class_prompts:
    conveyor: ["conveyor belt", "conveyor", "roller conveyor"]
    truck: ["truck"]
    mobile_robot: ["mobile robot", "wheeled robot"]
    red_cube: ["red cube", "small red block"]
  verify_top_k:                # candidates (by detector score) sent to Qwen crop verification
    conveyor: 8
    truck: 3
    mobile_robot: 3
  # If no candidate of these classes is verified, ask Qwen3-VL for a box (source recorded).
  qwen_fallback_classes: [conveyor, truck]
  roi_detector: true           # also run the detector on the zoomed conveyor ROI (red cube prompts)

verification:
  # Object descriptions inserted into prompts.verify_object. {color}/{object_class} come from the task.
  descriptions:
    target: "a small {color} {object_class}"
    # DEV NOTE 2026-11-15: with "a conveyor (...)" Qwen answered "robot arm" for the box of the real
    # production line (conveyor + arms) in the reference image. Description widened to the equipment.
    conveyor: "a conveyor or a production line containing a conveyor (robot arms or machines beside the conveyor may also be inside the box)"
    truck: "a truck (a vehicle with a cab and a cargo bed; a toy or model truck counts)"
    mobile_robot: "a wheeled mobile robot, i.e. a small ground vehicle that drives on the floor (not a fixed robot arm, not a truck, not a cart)"

target_inspection:
  roi_margin_ratio: 0.6       # ROI = conveyor bbox expanded by this ratio of its size
  roi_min_margin_px: 120
  roi_zoom_long_side_px: 1600
  roi_max_zoom: 4.0
  hsv_red_ranges: [[0, 10], [170, 180]]   # OpenCV hue (0-179)
  hsv_min_saturation: 120
  hsv_min_value: 70
  candidate_min_area_raw_px: 40
  candidate_max_area_raw_px: 4000
  candidate_max_aspect: 2.5
  candidate_min_solidity: 0.6
  merge_iou: 0.3
  max_candidates_to_verify: 8
  verify_crop_pad_ratio: 1.5
  verify_crop_min_px: 64
  verify_crop_upscale_px: 448
  robot_max_candidates_to_verify: 3

prompts:
  # Every prompt is versioned; the manifest records id + sha256 of the text actually used.
  task_parse:
    id: task_parse_v1
    text: |
      You convert one robot work instruction (Korean or English) into JSON. Return JSON only, no prose.
      Schema:
      {"status": "ok" | "unsupported" | "ambiguous" | "missing_information",
       "task_type": "transport_and_place" | "navigate_to_region" | null,
       "target": {"class": <singular English noun>, "color": <English color word or null>, "count": <integer>,
                  "source_reference": <English noun or null>, "source_relation": "produced_by" | "on" | "near" | "from" | null} | null,
       "destination": {"region_type": <snake_case English noun phrase, e.g. "loading_area">, "reference_object": <English noun or null>} | null,
       "reason": <one short English sentence>}
      Rules:
      - transport_and_place: the robot picks up one object and places it at a destination.
      - navigate_to_region: the robot itself moves to a destination; target must be null.
      - Any other kind of action (rotate, stack, sort, open, clean, ...) -> status "unsupported".
      - If it is unclear which object or destination is meant -> status "ambiguous".
      - If the object to move or the destination is not stated -> status "missing_information".
      - count = number of objects the instruction asks to move.
      - Use only information stated in the instruction; do not invent objects.
      Instruction: """{command}"""
  scene_analysis:
    id: scene_analysis_v1
    text: |
      You are assisting a mobile-robot task planner. Describe the work environment in this image.
      Base every statement only on what is visible. Return JSON only, no prose:
      {"scene_type": <short English phrase>,
       "observed_equipment": [<English noun phrases>],
       "transport_objects": [<vehicles, carts, pallets, containers seen>],
       "task_relevant_objects": [<visible objects relevant to the task below>],
       "evidence": [<short visual evidence statements>],
       "uncertain": [<things that cannot be determined from this single image>]}
      Task: {task_summary}
  verify_object:
    id: verify_object_v1
    text: |
      The green box in this zoomed image marks one candidate object. Is the object inside the green box {description}?
      Answer "no" if it is a different kind of object or a different color.
      Return JSON only, no prose:
      {"answer": "yes" | "no" | "uncertain", "observed_color": <English>, "observed_object": <English>, "reason": <one short sentence>}
  region_select:
    # v2 (DEV NOTE 2026-11-15): v1 asked for one area only; on the reference image it chose an area
    # outside the robot workspace. v2 asks for a per-candidate plausibility judgement; Python then
    # combines it with the deterministic robot-accessibility check.
    id: region_select_v2
    text: |
      This image shows a truck marked by a white box labeled "T" and numbered candidate floor areas ({candidate_ids}) drawn around it.
      For each numbered area, judge whether it could be the loading area of this truck, i.e. where goods are handed over to or from the truck.
      Use visible cues such as the cargo bed and its open side, the truck's orientation, floor markings and nearby equipment.
      Return JSON only, no prose:
      {"candidates": [{"id": <number>, "plausible": "yes" | "no" | "uncertain", "reason": <short>}],
       "best": <number or null>, "evidence": [<short visible cues>], "uncertain": [<what cannot be determined>]}
  region_judge:
    # v0.2: one candidate per image (no overlapping numbered outlines). The model judges the area's
    # function only; it does not see the robot map, the reference zones or any accessibility result.
    id: region_judge_v1
    text: |
      This top-down image of a work floor shows a truck marked by a white box labeled "T" and one candidate area outlined in green.
      Is the outlined area part of the loading/unloading area of this truck, i.e. a place where goods are handed over to or from this truck?
      Use visible cues such as floor markings, the truck's position and nearby equipment.
      Answer "no" if the outlined area is a walkway, a safety zone, an area of other equipment, or unrelated floor.
      Return JSON only, no prose:
      {"answer": "yes" | "no" | "uncertain", "reason": <one short sentence>}
  grounding_fallback:
    id: grounding_fallback_v1   # ported from EXP110 c1_prompt (read-only reference)
    text: |
      Find every instance of "{query}" in this image. Return JSON only, no prose: {"objects": [{"bbox_2d": [x1, y1, x2, y2]}]} with integer coordinates normalized to 0-1000 relative to image width and height. If there is no such object, return {"objects": []}.
