[pytest]
testpaths = tests
# ~/.bashrc puts ROS 2 Humble on PYTHONPATH; its pytest plugins (entry points) are not installed
# for this env and break collection. Disable them here instead of changing the ROS environment.
addopts = -p no:cacheprovider -p no:ament_copyright -p no:ament_flake8 -p no:ament_lint -p no:ament_pep257 -p no:ament_xmllint -p no:launch_ros -p no:launch_testing
markers =
    models: needs the qwen_vl model worker + GPU (run with STNAV_RUN_MODEL_TESTS=1)
